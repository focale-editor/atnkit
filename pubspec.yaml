name: atnkit
description: A pure Dart codec for Adobe Photoshop ATN action-set files.
version: 0.1.0
homepage: https://github.com/focale-editor/atnkit
repository: https://github.com/focale-editor/atnkit

topics:
  - photoshop
  - actions
  - automation
  - codec
  - file-format

screenshots:
  - description: 'A flat illustration of ATN action-sequence decoding and encoding.'
    path: screenshots/overview.png

environment:
  sdk: '>=3.13.0 <4.0.0'

dependencies:
  pscore: '>=0.1.5 <0.2.0'

dev_dependencies:
  checks: ^0.3.2
  lints: ^6.1.0
  release: ^0.1.11
  test: ^1.32.0

release:
  changelog:
    header: '# 📰 AtnKit changelog'
    defaultIgnoredTypes: ['test']
    defaultIgnoredScopes: ['repo', 'docs', 'version', 'deps', 'tools']
